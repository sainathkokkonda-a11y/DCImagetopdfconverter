<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Image to PDF Converter</title>
  
  <!-- Stable jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- Link CSS File -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator-card">
  <div class="header-box">
    <h2>Image to PDF Converter</h2>
    <p>Convert, customize, and save your images in PDF format</p>
  </div>

  <div class="form-body">
    
    <div class="input-group full-width">
      <label>Select Images</label>
      <div class="upload-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
        <p>Click or Drag & Drop Images Here</p>
        <span>Supports JPG, PNG, WEBP</span>
        <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)">
      </div>
    </div>

    <div class="options-grid">
      
      <div class="input-group">
        <label>Output File Name</label>
        <input type="text" id="fileName" class="custom-input" placeholder="e.g. My_Document">
      </div>

      <div class="input-group">
        <label>Page Format</label>
        <select id="pageSize" class="custom-select">
          <option value="a4">A4 Standard</option>
          <option value="letter">US Letter</option>
          <option value="a3">A3 Large Format</option>
          <option value="fit">Fit to Image Size</option>
        </select>
      </div>

      <div class="input-group">
        <label>Page Orientation</label>
        <select id="pOrient" class="custom-select">
          <option value="p">Portrait (Vertical)</option>
          <option value="l">Landscape (Horizontal)</option>
        </select>
      </div>

      <div class="input-group">
        <label>Page Margins</label>
        <select id="pMargin" class="custom-select">
          <option value="0">No Margin</option>
          <option value="12">Standard Margin</option>
          <option value="25">Wide Margin</option>
        </select>
      </div>

      <div class="input-group">
        <label>Color Mode</label>
        <select id="imgFilter" class="custom-select">
          <option value="none">Original Colors</option>
          <option value="grayscale">Grayscale (B&W)</option>
        </select>
      </div>

      <div class="input-group full-width">
        <label>Page Numbering</label>
        <select id="addNumbers" class="custom-select">
          <option value="yes">Add Page Numbers</option>
          <option value="no">No Page Numbers</option>
        </select>
      </div>

      <!-- Watermark Card -->
      <div class="section-card">
        <div class="section-title">Watermark Settings</div>
        <div class="options-grid">
          
          <div class="input-group">
            <label>Watermark Text</label>
            <input type="text" id="wmarkText" class="custom-input" placeholder="e.g. CONFIDENTIAL">
          </div>

          <div class="input-group">
            <label>Position</label>
            <select id="wmPosition" class="custom-select">
              <option value="center">Center</option>
              <option value="top-left">Top Left</option>
              <option value="top-right">Top Right</option>
              <option value="bottom-left">Bottom Left</option>
              <option value="bottom-right">Bottom Right</option>
            </select>
          </div>

          <div class="input-group">
            <label>Font Size</label>
            <input type="number" id="wmSize" class="custom-input" value="30" min="10" max="100">
          </div>

          <div class="input-group">
            <label>Rotation Angle</label>
            <select id="wmAngle" class="custom-select">
              <option value="45">45° Diagonal</option>
              <option value="0">0° Horizontal</option>
              <option value="-45">-45° Reverse Diagonal</option>
              <option value="90">90° Vertical</option>
            </select>
          </div>

          <div class="input-group">
            <label>Opacity</label>
            <select id="wmOpacity" class="custom-select">
              <option value="0.2">Light (20%)</option>
              <option value="0.4">Medium (40%)</option>
              <option value="0.7">Dark (70%)</option>
              <option value="1.0">Solid (100%)</option>
            </select>
          </div>

          <div class="input-group">
            <label>Text Color</label>
            <input type="color" id="wmColor" class="custom-input" value="#888888" style="height: 44px; padding: 2px;">
          </div>

        </div>
      </div>

    </div>

    <div class="result-box">
      <div class="result-title" id="statusText">No images selected yet</div>
      <div class="preview-grid" id="previewGrid"></div>
    </div>

    <div class="btn-group">
      <button class="btn-reset" onclick="resetAll()">Reset All</button>
      <button class="btn-submit" id="convertBtn" onclick="generatePDF()" disabled>Convert & Download PDF</button>
    </div>

  </div>
</div>

<!-- Link JS File -->
<script src="script.js"></script>

</body>
</html>
